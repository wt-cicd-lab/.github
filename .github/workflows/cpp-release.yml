name: C++ Tag and Release

on:
  workflow_call:
    secrets:
      CI_SSH_KEY:
        description: SSH private key for source and private build dependencies
        required: true

permissions:
  contents: read

jobs:
  tag:
    name: Generate version tag
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && !github.event.deleted }}
    runs-on: [self-hosted, linux, x64, wwj-cicd]
    timeout-minutes: 30

    concurrency:
        group: auto-version-tag
        cancel-in-progress: false
        queue: max

    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
        - name: Checkout source
          uses: actions/checkout@v4
          with:
            ref: ${{ github.sha }}
            fetch-depth: 0
            clean: true
            persist-credentials: false
            ssh-key: ${{ secrets.CI_SSH_KEY }}

        - name: Start SSH agent
          uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
          with:
            ssh-private-key: ${{ secrets.CI_SSH_KEY }}
            ssh-auth-sock: ${{ runner.temp }}/ssh-agent-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}.sock
            log-public-key: false

        - name: Prepare
          uses: wt-cicd-lab/.github/actions@com_dev
          with:
                phase: prepare

        - name: Build Release
          uses: wt-cicd-lab/.github/actions@com_dev
          with:
            phase: build
            build-type: Release
            coverage: "false"

        - name: Test
          uses: wt-cicd-lab/.github/actions@com_dev
          with:
            phase: test

        - name: Generate and push version tag
          uses: wt-cicd-lab/.github/actions@com_dev
          with:
                phase: tag

        - name: Export version tag
          id: version
          shell: bash
          run: |
            tag="$(cat artifacts/release-tag.txt)"
            git check-ref-format "refs/tags/$tag"
            printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"


  release:
    name: RelWithDebInfo build and artifact
    needs: tag
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && !github.event.deleted }}
    runs-on: [self-hosted, linux, x64, wwj-cicd]
    timeout-minutes: 30

    env:
      RELEASE_TAG: ${{ needs.tag.outputs.tag }}

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.tag.outputs.tag}}
          fetch-depth: 0
          clean: true
          persist-credentials: false
          ssh-key: ${{ secrets.CI_SSH_KEY }}

      - name: Verify release source
        shell: bash
        run: |
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "Release tag does not match the triggering commit." >&2
            exit 1
          fi

      - name: Start SSH agent
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: ${{ secrets.CI_SSH_KEY }}
          ssh-auth-sock: ${{ runner.temp }}/ssh-agent-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}.sock
          log-public-key: false

      - name: Prepare
        uses: wt-cicd-lab/.github/actions@com_dev
        with:
          phase: prepare

      - name: Compile RelWithDebInfo
        uses: wt-cicd-lab/.github/actions@com_dev
        with:
          phase: build
          build-type: RelWithDebInfo
          coverage: "false"

      - name: Test release build
        uses: wt-cicd-lab/.github/actions@com_dev
        with:
          phase: test
          build-type: RelWithDebInfo
          coverage: "false"

      - name: Package
        uses: wt-cicd-lab/.github/actions@com_dev
        with:
          phase: package
          build-type: RelWithDebInfo
          coverage: "false"

      - name: Persist artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-build-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/build-output.tar.gz
            artifacts/build-info.txt
            artifacts/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
